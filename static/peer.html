<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | AI Student Recommendations</title>
    <meta name="description" content="Discover top student profiles using advanced semantic embeddings and machine learning.">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <h1>CampusConnect</h1>
            </div>
            <div class="subtitle">AI-Powered Student Discovery Engine</div>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-card glassy">
                    <h2>Find Matches</h2>
                    <p>Enter a Student ID to discover semantically similar peers based on skills, projects, and academic performance.</p>
                    
                    <form id="recommendForm" class="search-form">
                        <div class="input-group">
                            <label for="studentId">Student ID</label>
                            <input type="number" id="studentId" name="studentId" placeholder="e.g. 1" required min="1">
                        </div>
                        
                        <div class="input-group">
                            <label for="topN">Number of Results</label>
                            <input type="number" id="topN" name="topN" value="5" min="1" max="50">
                        </div>
                        
                        <button type="submit" class="btn-primary">
                            <span>Get Recommendations</span>
                            <i class="fa-solid fa-sparkles"></i>
                        </button>
                    </form>
                </div>
            </section>

            <section class="results-section" id="resultsSection">
                <div id="targetContainer" class="target-container"></div>
                <div class="results-header hidden" id="resultsHeader">
                    <h2>Top Recommendations</h2>
                    <div class="view-toggles">
                        <button type="button" class="toggle-btn active" id="cardViewBtn" title="Card View"><i class="fa-solid fa-table-cells-large"></i></button>
                        <button type="button" class="toggle-btn" id="listViewBtn" title="List View"><i class="fa-solid fa-list-ul"></i></button>
                    </div>
                </div>
                
                <div id="loader" class="loader-container hidden">
                    <div class="spinner"></div>
                    <p>Analyzing profiles...</p>
                </div>
                
                <div id="errorMsg" class="error-message hidden"></div>
                
                <div id="resultsContainer" class="results-grid">
                    <!-- Results will be injected here -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 CampusConnect. Powered by SentenceTransformers.</p>
        </footer>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
